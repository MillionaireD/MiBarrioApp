				<div class="inner">
					<h2>Reporta un problema en tu comunidad</h2>
					<p>Ayúdanos a mejorar tu barrio informando de manera clara cualquier inconveniente.</p>

				</div>

			<div class="wrapper">
				<div class="inner">
					<h3 class="major">Formulario de reporte</h3>

					<!-- Contenedor para mensajes emergentes -->
					<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

					<!-- Tu formulario aquí -->
					<form method="post" action="assets/php/enviar_reporte.php" enctype="multipart/form-data">
						<!-- ¿Deseas que el reporte sea anónimo? -->
						<div class="fields">
							<div class="field">
								<label for="anonimo">¿Deseas que tu reporte sea anónimo?</label>
								<select name="anonimo" id="anonimo">
									<option value="no">No</option>
									<option value="si">Sí</option>
								</select>
							</div>
						</div>

						<!-- Datos personales -->
						<div class="fields" id="datosUsuario">
							<div class="field half">
								<label for="name">Tu nombre</label>
								<input type="text" name="name" id="name" />
							</div>
							<div class="field half">
								<label for="email">Correo electrónico</label>
								<input type="email" name="email" id="email" />
							</div>
						</div>

						<!-- Tipo de problema -->
						<div class="fields">
							<div class="field">
								<label for="problema">Tipo de problema</label>
								<select name="problema" id="problema">
									<option value="">Selecciona un tipo</option>
									<option value="basura">Acumulación de basura</option>
									<option value="alumbrado">Alumbrado público dañado</option>
									<option value="calle">Huecos o baches en la vía</option>
									<option value="agua">Fuga de agua potable</option>
									<option value="parque">Daños en áreas verdes</option>
									<option value="otro">Otro tipo de problema</option>
								</select>
							</div>
						</div>

						<!-- Descripción adicional -->
						<div class="fields" id="detalleOtro" style="display: none;">
							<div class="field">
								<label for="descripcion">Describe el problema</label>
								<textarea name="descripcion" id="descripcion" rows="4" placeholder="Describe el problema en detalle..."></textarea>
							</div>
						</div>

						<!-- Ubicación del problema -->
						<div class="fields">
							<div class="field">
								<label for="ubicacion-texto">Ubicación del problema</label>
								<input type="text" id="ubicacion-texto" name="ubicacion-texto" placeholder="Haz clic en el mapa para seleccionar la ubicación" readonly>
								<input type="hidden" name="ubicacion" id="ubicacion" value="">
								<label style="margin-top: 15px; display: block;">Selecciona la ubicación en el mapa</label>
								<div id="map" style="height: 400px; width: 100%;"></div>
							</div>
						</div>

						<!-- Subir imágenes -->
						<div class="fields">
							<div class="field">
								<label for="imagenes">Subir imágenes (puedes seleccionar varias)</label>
								<input type="file" name="imagenes[]" id="imagenes" accept="image/*" multiple />
							</div>
						</div>

						<!-- Enviar -->
						<ul class="actions">
							<li><input type="submit" value="Enviar reporte" class="primary" /></li>
						</ul>
					</form>
