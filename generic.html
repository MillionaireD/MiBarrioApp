<!DOCTYPE HTML>
<html>

<head>
  <title>Reportar Problema - MiBarrioApp</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
   <link rel="stylesheet" href="assets/css/stmap.css" />
  <noscript>
    <link rel="stylesheet" href="assets/css/noscript.css" />
  </noscript>
</head>

<body class="is-preload">

  <button id="scrollTopBtn" title="Volver arriba">↑</button> 

  <div id="page-wrapper">

    <!-- Header adaptado -->
    <header id="header">
      <h1>
        <a href="index.html">
          MiBarrioApp
          <img src="images/Logo.png" alt="Logo"
            style="height: 40px; vertical-align: middle; margin-left: 8px;">
        </a>
      </h1>
      <nav>
        <a href="#menu">Menu</a>
      </nav>
    </header>

    <!-- Menú responsive completo -->
    <nav id="menu">
      <div class="inner">
        <h2>Menu</h2>
        <ul class="links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="generic.html">Reportar</a></li>
          <li><a href="noticias.html">Noticias del Barrio</a></li>
          <li><a href="sobrenosotros.html">Sobre Nosotros</a></li>
        </ul>
        <a href="#" class="close">Cerrar</a>
      </div>
    </nav>

    <!-- Formulario de reporte -->
    <section id="wrapper">
      <header>
        <div class="inner">
          <h2>Reporta un problema en tu comunidad</h2>
          <p>Ayúdanos a mejorar tu barrio informando de manera clara cualquier inconveniente.</p>
          <img src="images/test5.webp" alt="Imagen de comunidad"
            style="margin-top: 20px; max-width: 100%; border-radius: 12px;">
        </div>
      </header>

      <div class="wrapper">
        <div class="inner">
          <h3 class="major">Formulario de reporte</h3>

          <!-- Contenedor para mensajes emergentes -->
          <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

          <!-- Formulario modificado para Formspree con tu ID único -->
          <form action="https://formspree.io/f/mnnqpwwr" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="_subject" value="Nuevo Reporte - MiBarrioApp">
            <input type="hidden" name="_language" value="es">

          <form method="post" action="#" enctype="multipart/form-data">
            <!-- ¿Deseas que el reporte sea anónimo? -->
            <div class="fields">
              <div class="field">
                <label for="anonimo">¿Deseas que tu reporte sea anónimo?</label>
                <select name="anonimo" id="anonimo">
                  <option value="no">No</option>
                  <option value="si">Sí</option>
                </select>
              </div>
            </div>

            <!-- Datos personales -->
            <div class="fields" id="datosUsuario">
              <div class="field half">
                <label for="name">Tu nombre</label>
                <input type="text" name="name" id="name" />
              </div>
              <div class="field half">
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" id="email" />
              </div>
            </div>

            <!-- Tipo de problema -->
            <div class="fields">
              <div class="field">
                <label for="problema">Tipo de problema</label>
                <select name="problema" id="problema">
                  <option value="">Selecciona un tipo</option>
                  <option value="Acumulación de basura">Acumulación de basura</option>
                  <option value="Alumbrado público dañado">Alumbrado público dañado</option>
                  <option value="Huecos o baches en la vía">Huecos o baches en la vía</option>
                  <option value="Fuga de agua potable">Fuga de agua potable</option>
                  <option value="Daños en áreas verdes">Daños en áreas verdes</option>
                  <option value="otro">Otro tipo de problema</option> 
                </select>
              </div>
            </div>

            <!-- Descripción adicional -->
            <div class="fields" id="detalleOtro" style="display: none;">
              <div class="field">
                <label for="descripcion">Describe el problema</label>
                <textarea name="descripcion" id="descripcion" rows="4"
                  placeholder="Describe el problema en detalle..."></textarea>
              </div>
            </div>

            <!-- Ubicación del problema -->
            <div class="fields">
              <div class="field">
                <label for="ubicacion-texto">Ubicación del problema</label>
                <input type="text" id="ubicacion-texto" name="ubicacion-texto" placeholder="Haz clic en el mapa para seleccionar la ubicación" readonly>
                <input type="hidden" name="ubicacion" id="ubicacion" value="">
                <label style="margin-top: 15px; display: block;">Selecciona la ubicación en el mapa</label>
                <div id="map" style="height: 400px; width: 100%;"></div>
              </div>
            </div>

            <!-- Enviar -->
            <ul class="actions">
              <li><input type="submit" value="Enviar reporte" class="primary" /></li>
            </ul>
          </form>

        </div>
      </div>
    </section>

    <!-- Footer -->
    <section id="footer">
      <div class="inner">
        <ul class="copyright">
          <li>&copy; MiBarrioApp. Todos los derechos reservados.</li>
        </ul>
      </div>
    </section>

  </div>

  <!-- Scripts -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/jquery.scrollex.min.js"></script>
  <script src="assets/js/browser.min.js"></script>
  <script src="assets/js/breakpoints.min.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/script.js"></script>
  <script src="assets/js/scmap.js"></script>

  <!-- API de Google Maps -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC4wlbQk7BUkhmU28uEK8xr9jdB4i5B_IM&libraries=geometry&callback=initMap">
  </script>

  <!-- Lógica de formulario -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const anonimoSelect = document.getElementById('anonimo');
      const datosUsuario = document.getElementById('datosUsuario');
      const problemaSelect = document.getElementById('problema');
      const detalleOtro = document.getElementById('detalleOtro');

      anonimoSelect.addEventListener('change', function () {
        if (this.value === 'si') {
          datosUsuario.style.display = 'none';
          datosUsuario.querySelectorAll('input').forEach(input => input.value = '');
        } else {
          datosUsuario.style.display = 'flex';
        }
      });

      problemaSelect.addEventListener('change', function () {
        if (this.value === 'otro') {
          detalleOtro.style.display = 'flex';
        } else {
          detalleOtro.style.display = 'none';
          document.getElementById('descripcion').value = '';
        }
      });
    });
  </script>

</body>

</html>
